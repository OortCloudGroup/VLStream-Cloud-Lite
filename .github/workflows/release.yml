name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-22.04
    env:
      IMAGE: ghcr.io/oortcloudgroup/vlstream-cloud-lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Test backend
        run: mvn -B -pl ruoyi-admin -am test
      - name: Set version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
      - name: Assemble release package
        run: |
          package="VLStream-wvp-lite-${{ github.ref_name }}"
          mkdir -p "dist/$package/sql/init" "dist/$package/sql/upgrade" "dist/$package/zlm"
          cp compose.yaml compose.external.yaml .env.example Dockerfile .dockerignore README.md DEPLOYMENT.md RELEASE_NOTES.md "dist/$package/"
          cp deploy/release/sql/init/10-ry-wvp.sql "dist/$package/sql/init/"
          cp -a deploy/release/sql/upgrade/. "dist/$package/sql/upgrade/"
          cp deploy/release/zlm/Dockerfile deploy/release/zlm/config.ini deploy/release/zlm/entrypoint-release.sh "dist/$package/zlm/"
          sed -i \
            -e 's|\./deploy/release/sql/init|./sql/init|g' \
            -e 's|\./deploy/release/zlm|./zlm|g' \
            "dist/$package/compose.yaml"
          (cd dist && zip -r "${package}.zip" "$package")
          (cd dist && sha256sum "${package}.zip" > "${package}.zip.sha256")
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "VLStream WVP Lite ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            "dist/VLStream-wvp-lite-${GITHUB_REF_NAME}.zip" \
            "dist/VLStream-wvp-lite-${GITHUB_REF_NAME}.zip.sha256"
