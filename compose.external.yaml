name: vlstream-wvp-lite

services:
  wvp-backend:
    image: ${WVP_IMAGE:-ghcr.io/oortcloudgroup/vlstream-cloud-lite:1.0.4}
    restart: unless-stopped
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SERVER_PORT: 8080
      DB_HOST: ${DB_HOST:?DB_HOST is required}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-ry-wvp}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_MIGRATION_USERNAME: ${DB_MIGRATION_USERNAME:?DB_MIGRATION_USERNAME is required}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?DB_MIGRATION_PASSWORD is required}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST is required}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      VLSTREAM_MQTT_ENABLED: ${VLSTREAM_MQTT_ENABLED:-true}
      VLSTREAM_MQTT_HOST: ${VLSTREAM_MQTT_HOST:?VLSTREAM_MQTT_HOST is required}
      VLSTREAM_MQTT_PORT: ${VLSTREAM_MQTT_PORT:-1883}
      VLSTREAM_MQTT_USERNAME: ${VLSTREAM_MQTT_USERNAME:-}
      VLSTREAM_MQTT_PASSWORD: ${VLSTREAM_MQTT_PASSWORD:-}
      VLSTREAM_WVP_MQTT_CLIENT_ID: ${VLSTREAM_WVP_MQTT_CLIENT_ID:-wvp-vlstream-backend}
      TOKEN_SECRET: ${TOKEN_SECRET:?TOKEN_SECRET is required}
      SIP_PORT: ${SIP_PORT:-8116}
      SIP_PASSWORD: ${SIP_PASSWORD:?SIP_PASSWORD is required}
      ZLM_HOST: ${ZLM_HOST:?ZLM_HOST is required}
      ZLM_HTTP_PORT: ${ZLM_HTTP_PORT:-8080}
      ZLM_HOOK_IP: ${ZLM_HOOK_IP:?ZLM_HOOK_IP is required}
      ZLM_PUBLIC_HOST: ${ZLM_PUBLIC_HOST:?ZLM_PUBLIC_HOST is required}
      ZLM_SECRET: ${ZLM_SECRET:?ZLM_SECRET is required}
      ZLM_RTP_PORT_RANGE: ${RTP_PORT_START:-40000},${RTP_PORT_END:-40300}
      ZLM_RTP_SEND_PORT_RANGE: ${RTP_PORT_START:-40000},${RTP_PORT_END:-40300}
      VLSTREAM_VERIFY_TOKEN: ${VLSTREAM_VERIFY_TOKEN:-}
      SSO_VERIFY_TOKEN: ${SSO_VERIFY_TOKEN:-}
      WVP_AUTH_MODE: ${WVP_AUTH_MODE:-LOCAL}
      DAHUA_ENABLED: ${DAHUA_ENABLED:-false}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx1024m -Dfile.encoding=UTF-8}
    ports:
      - "${WVP_HTTP_PORT:-8080}:8080"
      - "${SIP_PORT:-8116}:${SIP_PORT:-8116}/udp"
    volumes:
      - wvp-data:/app/data
      - wvp-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  wvp-data:
  wvp-logs:
